[package]
name = "inscribe-worker"
version = "0.1.0"
edition = "2024"
description = "A Cloudflare Worker that exposes the inscribe library as an authenticated JSON API."
license = "MIT"
publish = false

# This crate builds for wasm32-unknown-unknown only. It is not a member of
# the root package's workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
inscribe = { path = "..", default-features = false }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
worker = "0.8.7"

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "s"
