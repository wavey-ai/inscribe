[package]
name = "inscribe"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Create Bitcoin ordinal inscriptions with a local wallet and public Esplora and ord endpoints"
publish = false

[dependencies]
anyhow = "1.0"
bip39 = { version = "2.1", features = ["rand"] }
bitcoin = { version = "0.32.5", features = ["rand-std", "serde"] }
brotli = "8.0.1"
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
bitcoinconsensus = "0.106.0"
tempfile = "3"
